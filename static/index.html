<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba EventHub</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1d2330; --muted: #667085;
    --border: #e1e4ea; --accent: #3156d3; --accent-text: #ffffff;
    --user: #3156d3; --user-text: #ffffff; --bot: #eef1f6;
    --tool-bg: #fff7e6; --tool-border: #f0c36d; --ok: #1f8a4c; --danger: #c43c3c;
    --code: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1e26; --text: #e6e9ef; --muted: #98a2b3;
      --border: #2b313c; --accent: #6d8cff; --accent-text: #0b0e14;
      --user: #4166e0; --user-text: #ffffff; --bot: #232834;
      --tool-bg: #2b2516; --tool-border: #8a6d2a; --ok: #46c27a; --danger: #ef6b6b;
      --code: #232834;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .app { max-width: 860px; margin: 0 auto; padding: 16px; height: 100vh; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  header h1 { font-size: 18px; margin: 0; flex: 1 1 auto; }
  .estado { font-size: 13px; color: var(--muted); }
  .estado .punto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .estado.ok .punto { background: var(--ok); }
  .estado.mal .punto { background: var(--danger); }

  .barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .modo { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .modo button { border: 0; background: transparent; color: var(--text); padding: 6px 12px; cursor: pointer; font: inherit; }
  .modo button.activo { background: var(--accent); color: var(--accent-text); }
  .barra label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .barra input { font: inherit; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); width: 170px; }
  .barra .espacio { flex: 1; }

  button.btn { font: inherit; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.btn:hover { border-color: var(--accent); }
  button.primario { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.peligro { color: var(--danger); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  #mensajes { flex: 1; overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .msg.error { align-self: stretch; max-width: none; background: transparent; border: 1px solid var(--danger); color: var(--danger); font-size: 14px; }
  .msg.sistema { align-self: center; font-size: 12px; color: var(--muted); background: transparent; padding: 2px; }
  .tools { align-self: flex-start; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
  .tools code { background: var(--code); border-radius: 5px; padding: 1px 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); }
  .confirmar { align-self: flex-start; max-width: 85%; background: var(--tool-bg); border: 1px solid var(--tool-border); border-radius: 12px; padding: 10px 13px; }
  .confirmar p { margin: 0 0 8px; }
  .confirmar code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .confirmar .acciones { display: flex; gap: 8px; }
  .escribiendo { align-self: flex-start; color: var(--muted); font-size: 13px; font-style: italic; }

  form { display: flex; gap: 8px; }
  form textarea { flex: 1; font: inherit; resize: none; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); min-height: 46px; max-height: 140px; }
  form textarea:focus, .barra input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .sugerencias { display: flex; flex-wrap: wrap; gap: 6px; }
  .sugerencias button { font: inherit; font-size: 13px; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  .sugerencias button:hover { border-color: var(--accent); }

  @media (max-width: 560px) {
    .app { padding: 10px 16px; }
    .msg, .confirmar { max-width: 100%; }
    .barra input { width: 130px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Asistente EventHub · página de prueba</h1>
    <span id="estado" class="estado"><span class="punto"></span>comprobando servidor…</span>
  </header>

  <div class="barra">
    <div class="modo" role="tablist" aria-label="Modo">
      <button type="button" data-modo="chat" class="activo" title="POST /chat — agente con memoria y herramientas">Chat (agente)</button>
      <button type="button" data-modo="politicas" title="POST /politicas — solo la cadena LCEL, sin memoria">Solo políticas</button>
    </div>
    <label id="lbl-thread">thread_id <input id="thread" autocomplete="off"></label>
    <span class="espacio"></span>
    <button type="button" class="btn" id="nueva">Nueva conversación</button>
    <a class="btn" href="/docs" target="_blank" style="text-decoration:none;font-size:14px;padding:6px 12px;border:1px solid var(--border);border-radius:8px;color:var(--text)">/docs</a>
  </div>

  <div class="sugerencias" id="sugerencias"></div>

  <div id="mensajes" aria-live="polite"></div>

  <form id="form">
    <textarea id="entrada" rows="1" placeholder="Escribe un mensaje… (Enter para enviar, Shift+Enter para salto de línea)"></textarea>
    <button class="btn primario" id="enviar" type="submit">Enviar</button>
  </form>
</div>

<script>
const $ = (s) => document.querySelector(s);
const mensajes = $("#mensajes"), entrada = $("#entrada"), btnEnviar = $("#enviar"), inputThread = $("#thread");
let modo = "chat";
let pendiente = false;
let ocupado = false;

const SUGERENCIAS = [
  "¿Cuál es la política de devoluciones?",
  "¿Qué conciertos hay en Valencia?",
  "¿Y el más barato de esos?",
  "Estado del pedido PED-1001, email laura@otrodominio.com",
  "El email correcto es laura.martinez@example.com",
  "Resérvame 2 entradas del concierto más barato de Valencia",
  "¿Hay parking en el recinto?",
];

function nuevoThread() {
  return "web-" + Math.random().toString(36).slice(2, 8);
}

function guardarThread() {
  try { localStorage.setItem("eventhub_thread", inputThread.value); } catch (e) {}
}

function cargarThread() {
  let t = null;
  try { t = localStorage.getItem("eventhub_thread"); } catch (e) {}
  inputThread.value = t || nuevoThread();
}

function burbuja(clase, texto) {
  const d = document.createElement("div");
  d.className = "msg " + clase;
  d.textContent = texto;
  mensajes.appendChild(d);
  mensajes.scrollTop = mensajes.scrollHeight;
  return d;
}

function mostrarHerramientas(herramientas) {
  if (!herramientas || !herramientas.length) return;
  const d = document.createElement("div");
  d.className = "tools";
  d.append("🔧 Herramientas: ");
  for (const h of herramientas) {
    const c = document.createElement("code");
    c.textContent = `${h.nombre}(${JSON.stringify(h.argumentos)})`;
    d.appendChild(c);
  }
  mensajes.appendChild(d);
}

function mostrarConfirmacion(datos) {
  pendiente = true;
  actualizarBloqueo();
  const d = document.createElement("div");
  d.className = "confirmar";
  const p = document.createElement("p");
  const acciones = datos.acciones && datos.acciones.length ? datos.acciones : [{ accion: datos.accion, argumentos: datos.argumentos }];
  p.innerHTML = "⚠️ El asistente quiere ejecutar una acción que necesita tu confirmación:";
  d.appendChild(p);
  for (const a of acciones) {
    const c = document.createElement("p");
    const code = document.createElement("code");
    code.textContent = `${a.accion}(${JSON.stringify(a.argumentos)})`;
    c.appendChild(code);
    d.appendChild(c);
  }
  const fila = document.createElement("div");
  fila.className = "acciones";
  const si = document.createElement("button");
  si.className = "btn primario"; si.textContent = "Aprobar";
  const no = document.createElement("button");
  no.className = "btn peligro"; no.textContent = "Rechazar";
  si.onclick = () => confirmar(true, d);
  no.onclick = () => confirmar(false, d);
  fila.append(si, no);
  d.appendChild(fila);
  mensajes.appendChild(d);
  mensajes.scrollTop = mensajes.scrollHeight;
}

function indicador() {
  const d = document.createElement("div");
  d.className = "escribiendo";
  d.textContent = "El asistente está pensando…";
  mensajes.appendChild(d);
  mensajes.scrollTop = mensajes.scrollHeight;
  return d;
}

function actualizarBloqueo() {
  const bloqueado = ocupado || (pendiente && modo === "chat");
  btnEnviar.disabled = bloqueado;
  entrada.disabled = bloqueado;
  entrada.placeholder = pendiente && modo === "chat"
    ? "Aprueba o rechaza la acción pendiente para continuar…"
    : "Escribe un mensaje… (Enter para enviar, Shift+Enter para salto de línea)";
}

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  let datos = null;
  try { datos = await r.json(); } catch (e) {}
  if (!r.ok) {
    let detalle = datos && datos.detail ? datos.detail : `Error HTTP ${r.status}`;
    if (typeof detalle !== "string") detalle = JSON.stringify(detalle);
    const err = new Error(detalle);
    err.status = r.status;
    throw err;
  }
  return datos;
}

function procesarRespuesta(datos) {
  mostrarHerramientas(datos.herramientas);
  if (datos.estado === "pendiente_confirmacion") {
    mostrarConfirmacion(datos);
  } else {
    burbuja("bot", datos.respuesta || "(respuesta vacía)");
  }
}

async function enviar(texto) {
  texto = texto.trim();
  if (!texto || ocupado) return;
  if (modo === "chat" && pendiente) return;
  burbuja("user", texto);
  entrada.value = "";
  autoAltura();
  ocupado = true; actualizarBloqueo();
  const ind = indicador();
  try {
    if (modo === "chat") {
      const thread_id = inputThread.value.trim() || nuevoThread();
      inputThread.value = thread_id; guardarThread();
      procesarRespuesta(await post("/chat", { thread_id, mensaje: texto }));
    } else {
      const datos = await post("/politicas", { pregunta: texto });
      burbuja("bot", datos.respuesta);
    }
  } catch (e) {
    burbuja("error", e.message);
    if (e.status === 409 && modo === "chat") {
      // Hay una acción pendiente de un turno anterior (p. ej. tras recargar la página).
      mostrarConfirmacion({ accion: "acción pendiente de un turno anterior", argumentos: {} });
    }
  } finally {
    ind.remove();
    ocupado = false; actualizarBloqueo();
    if (!entrada.disabled) entrada.focus();
  }
}

async function confirmar(aprobar, tarjeta) {
  if (ocupado) return;
  tarjeta.querySelectorAll("button").forEach((b) => (b.disabled = true));
  burbuja("sistema", aprobar ? "✔ Has aprobado la acción" : "✖ Has rechazado la acción");
  ocupado = true; actualizarBloqueo();
  const ind = indicador();
  try {
    pendiente = false;
    procesarRespuesta(await post("/chat/confirmar", { thread_id: inputThread.value.trim(), aprobar }));
  } catch (e) {
    burbuja("error", e.message);
    if (e.status !== 409) {
      pendiente = true;
      tarjeta.querySelectorAll("button").forEach((b) => (b.disabled = false));
    }
  } finally {
    ind.remove();
    ocupado = false; actualizarBloqueo();
    if (!entrada.disabled) entrada.focus();
  }
}

function cambiarModo(m) {
  modo = m;
  document.querySelectorAll(".modo button").forEach((b) => b.classList.toggle("activo", b.dataset.modo === m));
  $("#lbl-thread").style.display = m === "chat" ? "" : "none";
  burbuja("sistema", m === "chat"
    ? "Modo chat: agente con memoria (por thread_id) y herramientas — POST /chat"
    : "Modo solo políticas: cadena LCEL sin memoria ni herramientas — POST /politicas");
  actualizarBloqueo();
}

function nuevaConversacion() {
  inputThread.value = nuevoThread(); guardarThread();
  pendiente = false;
  mensajes.innerHTML = "";
  burbuja("sistema", `Nueva conversación: thread_id = ${inputThread.value}`);
  actualizarBloqueo();
  entrada.focus();
}

function autoAltura() {
  entrada.style.height = "auto";
  entrada.style.height = Math.min(entrada.scrollHeight, 140) + "px";
}

async function comprobarServidor() {
  const el = $("#estado");
  try {
    const r = await fetch("/health");
    if (!r.ok) throw new Error();
    el.className = "estado ok";
    el.innerHTML = `<span class="punto"></span>servidor conectado (${location.host})`;
  } catch (e) {
    el.className = "estado mal";
    el.innerHTML = '<span class="punto"></span>servidor no disponible';
  }
}

// --- arranque ---
cargarThread();
for (const s of SUGERENCIAS) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = s;
  b.onclick = () => enviar(s);
  $("#sugerencias").appendChild(b);
}
document.querySelectorAll(".modo button").forEach((b) => (b.onclick = () => cambiarModo(b.dataset.modo)));
$("#nueva").onclick = nuevaConversacion;
inputThread.addEventListener("change", () => { pendiente = false; guardarThread(); actualizarBloqueo(); });
$("#form").addEventListener("submit", (e) => { e.preventDefault(); enviar(entrada.value); });
entrada.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(entrada.value); }
});
entrada.addEventListener("input", autoAltura);
burbuja("sistema", `Conversación con thread_id = ${inputThread.value}. Cambia el thread_id para comprobar que no se comparte memoria.`);
comprobarServidor();
entrada.focus();
</script>
</body>
</html>
